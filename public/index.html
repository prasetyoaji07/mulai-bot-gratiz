<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prasetyo Aji - Tugas Hacktiv</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="MBG-logo.png" />
</head>
<body>
  <main class="chat-container">
    <header class="chat-header">
      <div class="avatar"><img src="MBG-logo.png" alt="Logo Mulai Bot Gratiz" /></div>
      <div class="title">
        <h1>Mulai Bot Gratiz</h1>
        <p>Maju Bareng AI || Tugas Final Hacktiv8</p>
      </div>
      <button id="clear-btn" type="button" title="Mulai percakapan baru">🗑️ Reset</button>
    </header>

    <div id="chat-box" class="chat-box" aria-live="polite"></div>

    <div class="suggestions" id="suggestions">
      <button type="button" data-q="Apa itu gizi seimbang dan isi piringku?">Gizi Seimbang</button>
      <button type="button" data-q="Beri ide menu makan bergizi untuk anak SD hari ini">Menu Hari Ini</button>
      <button type="button" data-q="Bagaimana cara menjaga kebersihan makanan sebelum disajikan?">Kebersihan Makanan</button>
      <button type="button" data-q="Apa pengganti sayur untuk anak yang tidak suka sayur?">Anak Susah Makan Sayur</button>
    </div>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input type="text" id="user-input" placeholder="Tanya seputar gizi dan makan sehat..." required />
      <button type="submit" id="send-btn">Kirim</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
